[project]
name = "modulatio"
version = "0.9.9.4"
description = "Multi-model agent framework with plan-mode orchestration, integrated TUI, and team-state working memory."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "orchestration", "multi-agent", "tui", "plan-mode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Trimmed dependency surface — keep only what's actually imported in src/
# and tests/. The FastAPI / uvicorn / sqlmodel reservations that existed
# during earlier engine development have been dropped; if/when an HTTP
# surface or SQL-backed plan store ships, those deps come back as opt-in
# extras rather than baseline requirements. Smaller install surface +
# fewer CVE vectors.
dependencies = [
    "pydantic>=2.8",
    "textual>=0.80",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    # litellm >=1.92's completion() imports its MCP handler whenever `tools`
    # is passed (every agent call here), and that import chain needs orjson —
    # which litellm only declares in its proxy extra. Without this, a fresh
    # install resolving litellm 1.92+ fails EVERY tool-carrying model call.
    "orjson>=3",
    "typer>=0.12",
    "ddgs>=9.0",
    # Embedding-fallback routing (MiniLM via fastembed + LanceDB for the
    # agent-skill index). Routing embedder is decoupled from any
    # memory/knowledge stack.
    "fastembed>=0.3",
    "lancedb>=0.13",
    # Memory layer: team_memory uses pyarrow schemas for the LanceDB
    # index (same pattern as qc_history).
    "pyarrow>=15.0",
    # OS clipboard for the TUI's copy/paste (native on macOS/Windows; drives
    # xclip/xsel/wl-clipboard on Linux, which the setup wizard ensures).
    "pyperclip>=1.8",
]

[project.urls]
Homepage = "https://github.com/ModulatioAI/modulatio"
Repository = "https://github.com/ModulatioAI/modulatio"
Issues = "https://github.com/ModulatioAI/modulatio/issues"
Changelog = "https://github.com/ModulatioAI/modulatio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # starlette's preferred TestClient transport — keeps the web-API
    # tests' output pristine (its httpx path is deprecated).
    "httpx2>=2.0",
]
# `[export]` bundles a pandoc binary via pypandoc_binary so DOCX/PDF
# export works without a system pandoc install. modulatio/export.py
# still falls through to system pandoc when this extra isn't present,
# so either path works.
export = [
    "pypandoc_binary>=1.13",
]
# `[web]` ships the WebOS backend — a FastAPI + uvicorn server that serves
# the hand-authored static SPA and hooks straight into the engine seams.
# Opt-in so the base install stays lean (the TUI/CLI need none of it); the
# `modulatio-api` entry point prints an install hint when the extra is absent.
# The SPA itself is vanilla ES modules + CSS — no node, no build step, no
# runtime JS dependency; it ships as static files inside the wheel.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# `[mcp]` ships the Model Context Protocol client SDK so Modulatio can
# consume external MCP servers (their tools become first-class Modulatio
# tools). Opt-in — the base install carries no MCP code path; without this
# extra, configured MCP servers are inert with an install hint.
mcp = [
    "mcp>=1.0",
]

[project.scripts]
modulatio = "modulatio.cli:main"
# The WebOS server (opt-in `[web]` extra). The entry point itself always
# resolves; if fastapi/uvicorn aren't installed it prints the install hint
# rather than ImportError-ing at launch (see web.server.run).
modulatio-api = "modulatio.web.server:run"
modulatio-tui = "modulatio.tui:run"
modulatio-standards = "modulatio.cli_standards:main"
modulatio-memory = "modulatio.cli_memory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modulatio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so `from tests._thread_check import ...` (and any
# other `tests.*` helper import) resolves under the bare `pytest` console script,
# not only under `python -m pytest` (which adds cwd implicitly). CI runs bare
# `pytest`; without this, the concurrency tests fail collection with
# "No module named 'tests'".
pythonpath = ["."]
# Live provider round-trips (real subscription spend + network flake) are
# OPT-IN: `pytest -m live` runs them deliberately; the default gate — and the
# release stamp — stays deterministic. (Clif 2026-07-09, after a live Codex
# call flaked a full gate under concurrent load.)
markers = [
    "live: real provider/network round-trip — excluded from the default run",
]
addopts = "-m 'not live'"
