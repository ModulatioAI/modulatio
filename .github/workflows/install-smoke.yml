name: install-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke import
        run: python -c "import modulatio"

      - name: Lint (src + tests)
        # V2.1 audit Wave 2 (F9): tests are now ruff-clean too. Run
        # the lint over the whole repo on CI so a regression that
        # re-introduces unused imports / multi-statement lines /
        # `lambda` assigns / unused locals fails the install-smoke
        # job.
        run: ruff check src/ tests/

      - name: Pytest
        run: pytest -q --tb=no
