name: install-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, dev + web extras)
        # `[web]` so the WebOS test suite (FastAPI TestClient) actually runs
        # on CI — the base install stays lean, but the gate must exercise it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Smoke import
        run: python -c "import modulatio"

      - name: Lint (src + tests)
        # Tests are ruff-clean. Run the lint over the whole repo on CI
        # so a regression that re-introduces unused imports /
        # multi-statement lines / `lambda` assigns / unused locals
        # fails the install-smoke job.
        run: ruff check src/ tests/

      - name: Pytest
        run: pytest -q --tb=no
