name: release-deb

# Build the self-contained Debian package for a published release and attach
# it to that release: the versioned artifact plus a stable-named alias so
# .../releases/latest/download/modulatio_latest_amd64.deb never goes stale
# (the website's download button and install.sh point at the alias).

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (mutable major tags can move under us).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The release tag is untrusted input (a tag may be named `v1$(cmd)`), so
      # it never interpolates into a run: script. Validate the grammar once,
      # export the validated value, and reference only $TAG / $VERSION below.
      - name: Validate + export release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Anchored digits-and-dots grammar — shell globs aren't quantifiers,
          # so `v1.0.0$(cmd)` must be rejected, not merely "starts with v1.0.0".
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "refusing non-version tag: $RELEASE_TAG" >&2; exit 1
          fi
          echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      # Build toolchain (pip + build frontend + hatchling backend) comes from a
      # hash-pinned lock, so the release build never resolves mutable latest
      # tooling. --no-isolation makes `build` use the frozen backend we just
      # installed rather than PEP 517-resolving hatchling afresh.
      - name: Build wheel
        run: |
          python -m pip install --require-hashes -r packaging/requirements-build.lock
          python -m build --wheel --no-isolation

      - name: Build .deb
        run: bash packaging/build_deb.sh

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB="$(ls dist/modulatio_*_amd64.deb)"
          cp "$DEB" dist/modulatio_latest_amd64.deb
          # Manifest carries bare filenames (no dist/ prefix) so install.sh can
          # match by exact filename equality rather than a substring.
          ( cd dist && sha256sum "$(basename "$DEB")" modulatio_latest_amd64.deb > SHA256SUMS.deb )
          gh release upload "$TAG" \
            "$DEB" dist/modulatio_latest_amd64.deb dist/SHA256SUMS.deb --clobber

      # The container image is the same .deb installed into a minimal base
      # (see packaging/Dockerfile) — too large for a release asset, so it
      # publishes to GHCR, versioned + latest.
      - name: Publish container image
        run: |
          DEB="$(ls dist/modulatio_*_amd64.deb)"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f packaging/Dockerfile --build-arg DEB="$DEB" \
            -t "ghcr.io/modulatioai/modulatio:${VERSION}" \
            -t "ghcr.io/modulatioai/modulatio:latest" .
          docker push "ghcr.io/modulatioai/modulatio:${VERSION}"
          docker push "ghcr.io/modulatioai/modulatio:latest"
